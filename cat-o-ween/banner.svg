<svg width="680" height="232" viewBox="0 0 680 232" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Batman and Harvey dressed up for Halloween</title>
<style>
/* Mouths hinge from the top lip, each on its own rhythm so the two cats never sync up. */
.mouth { transform-box: fill-box; transform-origin: 50% 0%; }
.m1 { animation: chat 2.7s ease-in-out infinite; }
.m2 { animation: chat 3.5s ease-in-out -1.3s infinite; }
@keyframes chat {
  0%, 100% { transform: scaleY(1); }
  18% { transform: scaleY(.45); }
  32% { transform: scaleY(.9); }
  48% { transform: scaleY(.4); }
  70% { transform: scaleY(1); }
}
.wing { transform-box: fill-box; transform-origin: 50% 40%; animation: flap .5s ease-in-out infinite alternate; }
.b2 .wing { animation-duration: .42s; }
.b3 .wing { animation-duration: .58s; }
@keyframes flap { to { transform: scaleY(.35); } }
.drift { animation: drift 6s ease-in-out infinite alternate; }
.b2.drift { animation-duration: 7.5s; animation-delay: -2s; }
.b3.drift { animation-duration: 5s; animation-delay: -4s; }
@keyframes drift { to { transform: translate(14px, -8px); } }
.flicker { animation: flicker 1.8s ease-in-out infinite alternate; }
@keyframes flicker { to { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .m1, .m2, .wing, .drift, .flicker { animation: none; } }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07120a"/>
    <stop offset="1" stop-color="#1f4026"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset=".55" stop-color="#f3f7b0" stop-opacity=".4"/>
    <stop offset="1" stop-color="#f3f7b0" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="hd" clipPathUnits="userSpaceOnUse"><path d="M-95 10 C-95 -60 -50 -80 0 -80 C50 -80 95 -60 95 10 C95 60 50 78 0 78 C-50 78 -95 60 -95 10 Z"/></clipPath>
  <!-- A tuxedo chibi cat head, centred on 0,0 -->
  <g id="ears">
    <path d="M-72 -20 C-82 -60 -78 -96 -62 -110 C-44 -96 -26 -76 -14 -58 Z" fill="#1a1a1a" stroke="#07040d" stroke-width="4"/>
    <path d="M72 -20 C82 -60 78 -96 62 -110 C44 -96 26 -76 14 -58 Z" fill="#1a1a1a" stroke="#07040d" stroke-width="4"/>
    <path d="M-60 -48 C-66 -70 -64 -88 -58 -94 C-48 -84 -40 -74 -34 -62 Z" fill="#f6a9bb"/>
    <path d="M60 -48 C66 -70 64 -88 58 -94 C48 -84 40 -74 34 -62 Z" fill="#f6a9bb"/>
  </g>
  <g id="face">
    <path d="M-95 10 C-95 -60 -50 -80 0 -80 C50 -80 95 -60 95 10 C95 60 50 78 0 78 C-50 78 -95 60 -95 10 Z" fill="none" stroke="#07040d" stroke-width="4"/>
    <ellipse cx="-58" cy="36" rx="13" ry="7" fill="#ff9fb4"/>
    <ellipse cx="58" cy="36" rx="13" ry="7" fill="#ff9fb4"/>
    <path d="M-5 26 L5 26 L0 31 Z" fill="#f47f98" stroke="#07040d" stroke-width="2"/>
    <path d="M90 22 L114 16 M90 32 L114 36 M-90 22 L-114 16 M-90 32 L-114 36" stroke="#07040d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- The original happy closed eyes; colour picked per eye so it shows on black or white fur -->
  <path id="eye" d="M-14 0 Q0 -18 14 0" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <g id="bat">
    <path class="wing" d="M0 0 C-8 -10 -20 -12 -30 -6 C-24 -2 -22 4 -22 8 C-18 4 -12 4 -8 8 C-6 4 -3 2 0 2 C3 2 6 4 8 8 C12 4 18 4 22 8 C22 4 24 -2 30 -6 C20 -12 8 -10 0 0 Z" fill="#07040d"/>
    <ellipse cx="0" cy="1" rx="4" ry="6" fill="#07040d"/>
    <path d="M-3 -4 L-4 -9 L-1 -5 Z M3 -4 L4 -9 L1 -5 Z" fill="#07040d"/>
  </g>
  <g id="pumpkin">
    <path d="M-2 -26 Q0 -36 8 -38" stroke="#3d6b2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-14" cy="0" rx="18" ry="24" fill="#ff7a1a" stroke="#07040d" stroke-width="3"/>
    <ellipse cx="14" cy="0" rx="18" ry="24" fill="#ff7a1a" stroke="#07040d" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="14" ry="25" fill="#ff8c33" stroke="#07040d" stroke-width="3"/>
    <g class="flicker" fill="#ffd34d">
      <path d="M-16 -8 L-8 -8 L-12 -15 Z M8 -8 L16 -8 L12 -15 Z"/>
      <path d="M-17 4 Q0 18 17 4 L11 6 L8 2 L3 7 L0 3 L-3 7 L-8 2 L-11 6 Z"/>
    </g>
  </g>
</defs>

<rect width="680" height="232" rx="12" fill="url(#sky)"/>

<!-- stars -->
<g fill="#f6f9d8">
  <circle cx="40" cy="30" r="1.6"/><circle cx="120" cy="18" r="1.2"/><circle cx="250" cy="20" r="1.4"/>
  <circle cx="440" cy="22" r="1.8"/><circle cx="520" cy="60" r="1.2"/><circle cx="560" cy="16" r="1.5"/>
  <circle cx="25" cy="110" r="1.1"/><circle cx="410" cy="128" r="1"/><circle cx="270" cy="120" r="1.2"/>
</g>

<!-- full moon, centre stage -->
<circle cx="340" cy="84" r="92" fill="url(#glow)"/>
<circle cx="340" cy="84" r="62" fill="#f3f7b0"/>
<circle cx="318" cy="66" r="9" fill="#dfe79a"/><circle cx="362" cy="104" r="12" fill="#dfe79a"/><circle cx="360" cy="56" r="5" fill="#dfe79a"/><circle cx="326" cy="112" r="4" fill="#dfe79a"/>

<!-- spooky bare tree -->
<g fill="#040a06" stroke="#040a06" stroke-linecap="round" stroke-linejoin="round">
  <path d="M606 206 C618 172 622 132 612 98 C607 82 596 68 580 58 L585 53 C600 62 612 74 619 88 C621 70 629 52 644 38 L649 43 C637 58 630 76 630 98 C635 82 650 70 672 64 L673 70 C655 77 642 90 637 106 C632 138 636 176 650 206 Z"/>
  <path d="M582 56 L566 44 M580 58 L562 64 M566 44 L560 32 M566 44 L552 46 M646 40 L658 22 M646 40 L634 24 M658 22 L668 18 M672 66 L680 58 M612 98 L594 104 M594 104 L584 100" fill="none" stroke-width="3.5"/>
  <ellipse cx="626" cy="150" rx="5" ry="8" fill="#1f4026" stroke="none"/>
</g>

<!-- flying bats, each at its own tilt -->
<g class="drift"><use href="#bat" transform="translate(96 52) rotate(-18) scale(1.1)"/></g>
<g class="drift b2"><use href="#bat" transform="translate(356 40) rotate(14) scale(.8)"/></g>
<g class="drift b3"><use href="#bat" transform="translate(520 32) rotate(-30) scale(.95)"/></g>

<!-- graveyard hill -->
<path d="M0 200 Q170 172 340 196 T680 190 L680 232 L0 232 Z" fill="#0a170d"/>
<path d="M28 206 v-22 q0 -14 14 -14 q14 0 14 14 v22 Z" fill="#20372a" stroke="#040a06" stroke-width="2.5"/>
<text x="42" y="194" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#7f9d84">RIP</text>

<!-- Batman: bat wings, little fangs -->
<g transform="translate(210 140) scale(.82)" stroke-linejoin="round" stroke-linecap="round">
  <path d="M-80 -30 C-120 -70 -170 -70 -200 -40 C-180 -30 -176 -12 -178 4 C-160 -10 -140 -10 -128 6 C-122 -10 -104 -14 -90 -2 Z" fill="#0b120d" stroke="#040a06" stroke-width="4"/>
  <path d="M80 -30 C120 -70 170 -70 200 -40 C180 -30 176 -12 178 4 C160 -10 140 -10 128 6 C122 -10 104 -14 90 -2 Z" fill="#0b120d" stroke="#040a06" stroke-width="4"/>
  <use href="#ears"/>
  <path d="M-95 10 C-95 -60 -50 -80 0 -80 C50 -80 95 -60 95 10 C95 60 50 78 0 78 C-50 78 -95 60 -95 10 Z" fill="#fff"/>
  <g clip-path="url(#hd)"><path d="M-100 42 C-90 22 -60 16 -34 24 Q-22 -40 -10 -85 L10 -85 Q22 -40 34 24 C60 16 90 22 100 42 L100 -90 L-100 -90 Z" fill="#1a1a1a"/></g>
  <use href="#face"/>
  <use href="#eye" transform="translate(-40 18)" stroke="#fff"/>
  <use href="#eye" transform="translate(40 18)" stroke="#fff"/>
  <g class="mouth m1">
    <path d="M-14 36 Q0 60 14 36 Z" fill="#9b2c40" stroke="#07040d" stroke-width="3"/>
    <ellipse cx="0" cy="48" rx="6" ry="3.5" fill="#ff8fa6"/>
  </g>
  <path d="M-10 37 L-7 46 L-4 38 Z M4 38 L7 46 L10 37 Z" fill="#fff" stroke="#07040d" stroke-width="1.5"/>
  <path d="M-14 36 Q-7 41 0 32 Q7 41 14 36" stroke="#07040d" stroke-width="3" fill="none"/>
</g>

<!-- Harvey: Frankenstein's monster (neck bolts, flat-top hair, stitches, a green tinge) -->
<g transform="translate(470 140) scale(.82)" stroke-linejoin="round" stroke-linecap="round">
  <g fill="#9aa69e" stroke="#040a06" stroke-width="3">
    <rect x="-112" y="40" width="44" height="13" rx="3"/><rect x="-120" y="34" width="12" height="25" rx="3"/>
    <rect x="68" y="40" width="44" height="13" rx="3"/><rect x="108" y="34" width="12" height="25" rx="3"/>
  </g>
  <use href="#ears"/>
  <path d="M-95 10 C-95 -60 -50 -80 0 -80 C50 -80 95 -60 95 10 C95 60 50 78 0 78 C-50 78 -95 60 -95 10 Z" fill="#e2f4cf"/>
  <g clip-path="url(#hd)"><path d="M4 -90 C8 -40 16 0 28 28 C55 40 82 36 100 26 L100 -90 Z" fill="#1a1a1a"/><ellipse cx="-62" cy="-56" rx="30" ry="22" fill="#1a1a1a"/></g>
  <use href="#face"/>
  <path d="M-52 -96 L52 -96 L58 -40 L48 -52 L38 -38 L28 -54 L16 -40 L6 -54 L-6 -40 L-16 -54 L-28 -38 L-38 -54 L-48 -40 L-58 -52 Z" fill="#14241a" stroke="#040a06" stroke-width="3.5"/>
  <path d="M-80 -6 L-46 -22 M-72 -18 L-66 -2 M-62 -22 L-56 -8 M-52 -26 L-48 -12" stroke="#33463a" stroke-width="3" fill="none"/>
  <use href="#eye" transform="translate(-40 18)" stroke="#07040d"/>
  <use href="#eye" transform="translate(40 18)" stroke="#fff"/>
  <g class="mouth m2">
    <path d="M-16 36 Q0 64 16 36 Z" fill="#9b2c40" stroke="#07040d" stroke-width="3"/>
    <ellipse cx="0" cy="50" rx="7" ry="4" fill="#ff8fa6"/>
  </g>
  <path d="M-16 36 Q-8 41 0 32 Q8 41 16 36" stroke="#07040d" stroke-width="3" fill="none"/>
</g>

<!-- one jack-o'-lantern -->
<use href="#pumpkin" transform="translate(98 200) scale(.85)"/>
</svg>
